apiVersion: v1
kind: Pod
metadata:
  name: target-a
  namespace: chaos-dns-e2e
  labels:
    e2e: dns-controller
    role: target
spec:
  dnsPolicy: ClusterFirst
  containers:
  - name: client
    image: busybox:1.35
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: target-b
  namespace: chaos-dns-e2e
  labels:
    e2e: dns-controller
    role: target
