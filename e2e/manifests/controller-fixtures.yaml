  containers:
  - name: client
    image: busybox:1.35
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: control
  namespace: chaos-dns-e2e
  labels:
    e2e: dns-controller
    role: control
spec:
  dnsPolicy: ClusterFirst
  containers:
  - name: client
    image: busybox:1.35
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Service
metadata:
  name: error-target-a
  namespace: chaos-dns-e2e
spec:
  ports:
  - port: 80
