name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      - name: Run Go checks
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go mod tidy -diff
          go -C e2e test -run '^$' ./...
          go -C e2e vet ./...
          go -C e2e mod tidy -diff

      - name: Install minikube
        run: |
          curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          sudo install minikube-linux-amd64 /usr/local/bin/minikube
          rm minikube-linux-amd64

      - name: Run E2E tests
        run: ./e2e/e2e.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Chaos CoreDNS Logs ==="
          kubectl -n chaos-dns-e2e logs -l app=chaos-coredns --tail=200 || true
          echo "=== Test Pod Status ==="
          kubectl -n chaos-dns-e2e describe pod test-client || true
          echo "=== All Pods ==="
          kubectl -n chaos-dns-e2e get pods -o wide || true
