name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  e2e:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Run unit tests
        run: go test -race -count=1 ./chaos ./cmd/coredns

      - name: Run static analysis
        run: go vet ./chaos ./cmd/coredns

      - name: Install minikube
        run: |
          curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          sudo install minikube-linux-amd64 /usr/local/bin/minikube
          rm minikube-linux-amd64

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Run E2E tests
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/dns-e2e-artifacts
        run: ./e2e/e2e.sh

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dns-e2e-diagnostics
          path: ${{ runner.temp }}/dns-e2e-artifacts
          if-no-files-found: ignore
